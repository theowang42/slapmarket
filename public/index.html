<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>us-market-pulse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230b0c0e'/><path d='M3 11l3-4 3 2 4-6' stroke='%232fbf7f' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <!-- 放在样式表前同步执行：等模块脚本加载完再切主题，夜间用户每次打开都会先闪一下白屏 -->
  <script>try { if (localStorage.getItem('ump:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="bar-left">
        <span class="wordmark">us-market<span class="wordmark-dim">-pulse</span></span>
        <nav class="nav" id="nav"></nav>
        <span class="pill" id="session"><i class="dot"></i><span class="pill-label">连接中</span></span>
        <span class="et" id="et"></span>
      </div>
      <div class="bar-right">
        <div class="breadth" id="breadth" title="成分股涨跌家数"></div>
        <span class="meta" id="meta">加载中…</span>
        <button class="theme-btn" id="theme" title="切换白天 / 夜间（快捷键 T）"></button>
      </div>
    </header>

    <!-- 视图挂载点。路由只换这里，顶栏常驻。 -->
    <div id="view"></div>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
